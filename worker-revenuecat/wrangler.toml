name = "revenuecat-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[dev]
port = 8789

[vars]
# RevenueCat 项目 ID（Dashboard → Project Settings）
RC_PROJECT_ID = "proj463a2635"
# Supabase 项目地址（不要带末尾斜杠）
SUPABASE_URL = "https://hkhdizuncmaghkhtcvvw.supabase.co"
JWT_AUDIENCE = "authenticated"
# 可选：留空表示所有已登录用户可查询自己的订阅；填逗号分隔 UUID 白名单可访问 /v1/metrics/*
ALLOWED_SUBS = ""
# RevenueCat API 请求超时（毫秒）
UPSTREAM_TIMEOUT_MS = "30000"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# 敏感值用 secret 注入：
#   npx wrangler secret put REVENUECAT_SECRET_API_KEY
#   npx wrangler secret put REVENUECAT_REST_API_KEY
#   npx wrangler secret put REVENUECAT_WEBHOOK_SECRET
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# 仅当 Supabase 仍用旧版 HS256 时才需要：
#   npx wrangler secret put SUPABASE_JWT_SECRET
# 本地开发用 .dev.vars（见 .dev.vars.example）。
