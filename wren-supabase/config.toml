# Minimal Supabase project config for the Edge Functions. `supabase init`
# generates a fuller file (db, auth, studio…); the function blocks below are
# what matters for `supabase functions deploy`.
project_id = "wren"

# The AI gateway requires a valid Supabase JWT before our code even runs — an
# extra gate on top of the in-function getUser() check.
[functions.wren-voice]
verify_jwt = true

# Client-triggered Plus reconciliation (JWT + in-function getUser()).
[functions.sync-entitlement]
verify_jwt = true

# RevenueCat does not send a Supabase JWT; this function authenticates itself
# with a shared secret (REVENUECAT_WEBHOOK_SECRET), so platform JWT verification
# must be off.
[functions.revenuecat-webhook]
verify_jwt = false
