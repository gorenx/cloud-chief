name = "ai-gateway-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# 仅影响本地 `wrangler dev`（线上不涉及端口）。避免与 admin 服务的 8787 冲突。
[dev]
port = 8788

# 非敏感配置放 vars（可改）。
[vars]
CF_ACCOUNT_ID = "b3838716ec9751a9294f72ae81d4eba3"
CF_GATEWAY_ID = "qwen-gw"
PROVIDER_SLUG = "qwen-beijing-maas"
DEFAULT_MODEL = "qwen-plus"
FREE_MODEL = "qwen-plus"
PLUS_MODEL = "qwen-plus"

# ===== Free-tier policy (override defaults in gateway-core policy.ts) =====
FREE_DAILY_CEILING = "8"
MAX_TOKENS = "4096"
MAX_PROMPT_CHARS = "100000"
DEVICE_DAILY_CAP = "16"
IP_DAILY_CAP = "64"

# ===== Supabase 鉴权 + 服务端权威权益/配额 =====
# 你的 Supabase 项目地址（不要带末尾斜杠），用于拉 JWKS 公钥并校验 iss。
SUPABASE_URL = "https://hkhdizuncmaghkhtcvvw.supabase.co"
# Supabase 用户 access_token 的 aud；默认 authenticated（见 gateway-core JWT_AUDIENCE）。
JWT_AUDIENCE = "authenticated"
# 可选：留空表示允许所有已登录用户；填逗号分隔的用户 UUID 白名单。
ALLOWED_SUBS = ""
# 上游首字节超时（毫秒）：超过此时间还没拿到响应头则返回 504。只管“等响应头”，
# 不影响拿到响应头后的流式输出。默认 60000。
UPSTREAM_TIMEOUT_MS = "60000"

# ===== 按用户限流（每个 sub 在 period 秒内最多 limit 次）=====
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"   # 账户内唯一的整数标识（字符串形式）
  [ratelimits.simple]
  limit = 60
  period = 60           # 只能是 10 或 60

# 敏感值用 secret 注入，不要写在这里：
#   npx wrangler secret put CF_AIG_TOKEN
#   npx wrangler secret put DASHSCOPE_API_KEY
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# 仅当你的 Supabase 项目还在用「旧版 HS256 共享密钥」时才需要：
#   npx wrangler secret put SUPABASE_JWT_SECRET
# 本地开发用 .dev.vars（见 .dev.vars.example）。
