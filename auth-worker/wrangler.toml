name = "cloud-chief-auth-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8790

[vars]
APP_NAME = "Cloud Chief Auth"
BETTER_AUTH_URL = "http://localhost:8790"
FRONTEND_URL = "http://localhost:5173"
TRUSTED_ORIGINS = "http://localhost:5173,http://localhost:8790"
OAUTH_STRICT = "false"

# Optional social login. Leave blank to disable a provider.
GOOGLE_CLIENT_ID = ""
GITHUB_CLIENT_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "cloud-chief-auth"
database_id = "4ec621ce-d402-4beb-9765-841c82fc1c50"
# Secrets:
#   npx wrangler secret put BETTER_AUTH_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GITHUB_CLIENT_SECRET
