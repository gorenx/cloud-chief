<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qwen · Cloudflare AI Gateway</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b22;
    --border: #262c36;
    --text: #e6e9ef;
    --muted: #8b94a3;
    --accent: #6366f1;
    --user: #1f2630;
    --assistant: #14181f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .tag { font-size: 12px; color: var(--muted); background: #21262f; padding: 3px 8px; border-radius: 6px; }
  header select.gw {
    font-size: 12px; color: var(--text); background: #21262f; border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 6px; outline: none; cursor: pointer; max-width: 220px;
  }
  header select.gw:focus { border-color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 24px 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .msg { display: flex; gap: 12px; padding: 14px 0; }
  .avatar { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .user .avatar { background: var(--accent); color: #fff; }
  .assistant .avatar { background: #2a3340; color: #b9c2d0; }
  .bubble { line-height: 1.7; white-space: pre-wrap; word-break: break-word; padding-top: 4px; }
  .assistant .bubble { color: #d7dce4; }
  .hint { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 0; }
  .inputbar { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; max-height: 160px; outline: none; font-family: inherit;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer; height: 44px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
  <header>
    <h1>Qwen</h1>
    <span class="tag" id="modelTag">qwen-max</span>
    <span class="tag">via Cloudflare AI Gateway</span>
    <label class="tag" for="gatewaySelect" style="background:transparent;padding:0;">网关</label>
    <select id="gatewaySelect" class="gw" title="选择 AI Gateway 网关"></select>
    <a href="/config.html" style="margin-left:auto;color:#6366f1;text-decoration:none;font-size:13px;">配置后台 →</a>
  </header>

  <div id="chat">
    <div class="wrap">
      <div class="hint" id="hint">通过 Cloudflare AI Gateway 与 qwen-max 对话，输入消息开始。</div>
    </div>
  </div>

  <footer>
    <div class="inputbar">
      <textarea id="input" rows="1" placeholder="发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

<script>
  const chat = document.getElementById("chat").querySelector(".wrap");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const hint = document.getElementById("hint");
  const gatewaySelect = document.getElementById("gatewaySelect");
  const messages = [];
  let model = "qwen-max";
  let providerSlug = "";

  fetch("/config").then(r => r.json()).then(c => {
    model = c.model || model;
    document.getElementById("modelTag").textContent = model;
    providerSlug = c.provider_slug || "";
    const gateways = Array.isArray(c.gateways) ? c.gateways : [];
    gatewaySelect.innerHTML = "";
    if (gateways.length === 0) {
      const opt = document.createElement("option");
      opt.value = c.gateway || "";
      opt.textContent = c.gateway || "(无网关)";
      gatewaySelect.appendChild(opt);
    } else {
      for (const id of gateways) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        if (id === c.gateway) opt.selected = true;
        gatewaySelect.appendChild(opt);
      }
    }
  }).catch(() => {});

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);

  function addMsg(role, text) {
    if (hint) hint.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.innerHTML = `<div class="avatar">${role === "user" ? "你" : "Q"}</div><div class="bubble"></div>`;
    el.querySelector(".bubble").textContent = text;
    chat.appendChild(el);
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
    return el.querySelector(".bubble");
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", text);
    messages.push({ role: "user", content: text });
    const bubble = addMsg("assistant", "思考中…");

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model,
          messages,
          gateway: gatewaySelect.value || undefined,
          provider_slug: providerSlug || undefined,
        }),
      });

      const ctype = resp.headers.get("content-type") || "";
      if (!resp.ok || !ctype.includes("text/event-stream")) {
        const j = await resp.json().catch(() => null);
        bubble.classList.add("err");
        bubble.textContent = "请求失败 (" + resp.status + "): " + (j ? JSON.stringify(j.error || j) : "未知错误");
        return;
      }

      // 解析阿里云 Responses API 的 SSE：response.output_text.delta 增量拼接
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let acc = "", buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith("data:")) continue;
          const data = s.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            const ev = JSON.parse(data);
            if (ev.type === "response.output_text.delta" && ev.delta) {
              acc += ev.delta;
              bubble.textContent = acc;
            } else if (ev.type === "response.failed" || ev.error) {
              bubble.classList.add("err");
              bubble.textContent = "模型返回错误: " + JSON.stringify(ev.error || ev);
            }
          } catch {}
        }
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      }

      const content = acc || "(无内容返回)";
      if (!acc) bubble.textContent = content;
      messages.push({ role: "assistant", content });
    } catch (e) {
      bubble.classList.add("err");
      bubble.textContent = "错误: " + e.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
